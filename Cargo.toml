[workspace]
resolver = "2"
members = ["crates/bgpviews-core", "crates/bgpviews", "crates/bgpviews-tcp-md5"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/bgpkit/bgpviews"
authors = ["BGPKIT <mingwei@bgpkit.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
