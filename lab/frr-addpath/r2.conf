frr defaults traditional
hostname r2
log stdout
!
router bgp 65002
 bgp router-id 172.31.250.12
 ! eBGP requires a policy in FRR 8+; this lab has no policy, so allow the
 ! default.
 no bgp ebgp-requires-policy
 neighbor 172.31.250.11 remote-as 65001
 neighbor 172.31.250.11 description r1
 !
 address-family ipv4 unicast
  ! FRR's pre-policy BMP reads the Adj-RIB-In, which FRR only keeps when
  ! soft-reconfiguration inbound is enabled. Without this line the capture
  ! contains EoR markers and withdrawals but no announcements.
  neighbor 172.31.250.11 soft-reconfiguration inbound
  ! ADDPATH (RFC 7911): accept up to eight paths per prefix from r1.
  neighbor 172.31.250.11 addpath-rx-paths-limit 8
  neighbor 172.31.250.11 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 172.31.250.11 soft-reconfiguration inbound
  neighbor 172.31.250.11 activate
 exit-address-family
!
bmp targets bgpviews
 ! 172.31.250.1 is the host end of the docker bridge for this network. The
 ! listener binds 0.0.0.0:17901 and accepts only this router's address.
 bmp connect 172.31.250.1 port 17901 min-retry 1000 max-retry 2000
 bmp monitor ipv4 unicast pre-policy
 bmp monitor ipv6 unicast pre-policy
 ! A second target, on its own port, so one router can be archived by two collectors
 ! at once. That is what the multi-client test needs: two live sessions, not two runs.
 bmp connect 172.31.250.1 port 17903 min-retry 1000 max-retry 2000
!
