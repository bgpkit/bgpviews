frr defaults traditional
hostname r1
log stdout
!
router bgp 65001
 bgp router-id 172.31.250.11
 ! eBGP requires a policy in FRR 8+; this lab has no policy, so allow the
 ! default. Without this the session is Established but PfxSnt stays blocked.
 no bgp ebgp-requires-policy
 ! The test prefixes have no matching route in the RIB. Originate them
 ! directly instead of requiring an import check.
 no bgp network import-check
 neighbor 172.31.250.12 remote-as 65002
 neighbor 172.31.250.12 description r2
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  network 198.51.100.0/24
  network 203.0.113.0/24
  ! ADDPATH (RFC 7911): send every path with a path identifier. Even a single best path is
  ! encoded with one, which is what this lab needs: the point is to exercise the subtype, not
  ! to have two paths for the same prefix.
  neighbor 172.31.250.12 addpath-tx-all-paths
  neighbor 172.31.250.12 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8::/32
  ! ADDPATH (RFC 7911): send every path with a path identifier. Even a single best path is
  ! encoded with one, which is what this lab needs: the point is to exercise the subtype, not
  ! to have two paths for the same prefix.
  neighbor 172.31.250.12 addpath-tx-all-paths
  neighbor 172.31.250.12 activate
 exit-address-family
!
