[package]
name = "bgpviews-tcp-md5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TCP-MD5 keys for a listening socket: the one syscall bgpviews cannot make in safe Rust"

[dependencies]
libc = "0.2"

# This crate exists to hold `unsafe`. The rest of the workspace forbids it, and that
# boundary is the point: one leaf crate, one syscall, one place to audit.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
