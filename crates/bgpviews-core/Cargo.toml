[package]
name = "bgpviews-core"
description = "Collector internals for bgpviews: coverage log, journal framing, segment transaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.2.0 is the first non-yanked release: rc.1, rc.2 and rc.3 are all yanked on crates.io, so a
# fresh resolution cannot select them and the old pin only built from Cargo.lock and the local
# cache.
bgpkit-snap = "0.2.0"
bgpkit-parser = "0.23"
bytes = "1"
flate2 = "1"
ipnet = "2"
rkyv = "0.8"
arrow = { version = "60.1.0", default-features = false, features = ["ipc"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap"] }
nix = { version = "0.32.0", features = ["fs"] }

[dev-dependencies]
