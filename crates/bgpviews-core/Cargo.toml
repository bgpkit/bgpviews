[package]
name = "bgpviews-core"
description = "Collector internals for bgpviews: coverage log, journal framing, segment transaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bgpkit-snap = "1.0.0-rc.2"
bgpkit-parser = "0.23"
bytes = "1"
flate2 = "1"
ipnet = "2"
rkyv = "0.8"
arrow = { version = "60.1.0", default-features = false, features = ["ipc"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap"] }

[dev-dependencies]
