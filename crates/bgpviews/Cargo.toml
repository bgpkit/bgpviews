[package]
name = "bgpviews"
description = "Self-hosted BGP archive: BMP in, RouteViews-shaped MRT out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "bgpviews"
path = "src/main.rs"

[dev-dependencies]
# The examples read archives back with the ecosystem's parser, which is the point: a subtype
# the archive claims has to be readable by the tool a consumer would use.
bgpkit-parser = { version = "0.19", features = ["serde"] }

[dependencies]
bgpviews-core = { path = "../bgpviews-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
ipnet = "2"
signal-hook = "0.4.6"

